<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>StarAgent 管理面板</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div id="login" class="login-box glass-card">
<h1><span class="emoji">🔐</span> StarAgent 管理面板</h1>
<p class="sub">请输入凭据以继续</p>
<label>用户名</label>
<input id="luser" placeholder="请输入用户名" autocomplete="username" autofocus>
<label>密码</label>
<input id="lpass" type="password" placeholder="请输入密码" autocomplete="current-password">
<button class="btn btn-primary btn-lg" style="width:100%;margin-top:8px" onclick="doLogin()">登 录</button>

<div id="lerr" class="err"></div>
</div>

<div id="app">
<header class="glass">
<div class="logo">
<div class="dot" id="status-dot-header"></div>
<h1 id="header-title">StarAgent 管理面板</h1>
<span class="meta" id="header-meta"></span>
</div>
<div style="display:flex;align-items:center;gap:10px">
<button class="btn btn-ghost btn-sm" id="theme-toggle" onclick="toggleTheme()" title="切换浅色/深色主题">🌓</button>
<button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
</div>
</header>

<nav id="nav-bar" class="glass">
<a data-panel="dashboard" class="active">📊 状态</a>
<a data-panel="services">📦 子服务</a>
<a data-panel="traffic">📈 流量</a>
<a data-panel="control">⚡ 控制</a>
<a data-panel="config">⚙ 配置</a>
<a data-panel="logs">📋 日志</a>
<a data-panel="database">🗄 数据库</a>
<a data-panel="fileman">🗂 文件管理</a>
<a data-panel="plugins">🧩 插件</a>
<a data-panel="ai">🤖 AI 助手</a>
<a data-panel="terminal">🖥 在线终端</a>
<a data-panel="users">👥 用户</a>
</nav>

<div id="sec-banner" class="sec-banner hidden"></div>

<main>
<div id="panel-dashboard" class="panel active"></div>
<div id="panel-services" class="panel"></div>
<div id="panel-traffic" class="panel"></div>
<div id="panel-control" class="panel"></div>
<div id="panel-config" class="panel"></div>
<div id="panel-logs" class="panel"></div>
<div id="panel-database" class="panel"></div>
<div id="panel-fileman" class="panel"></div>
<div id="panel-plugins" class="panel"></div>
<div id="panel-ai" class="panel"></div>
<div id="panel-terminal" class="panel"></div>
<div id="panel-users" class="panel"></div>
</main>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
<div class="modal-box">
<h3 id="modal-title"></h3>
<div id="modal-body" style="font-size:13px;color:var(--text-secondary);margin-bottom:22px;line-height:1.6"></div>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">取消</button>
<button class="btn btn-primary" id="modal-confirm-btn" onclick="confirmModal()">确认</button>
</div>
</div>
</div>

<!-- 插件查看弹窗：iframe 悬浮层，不替换面板内容 -->
<div id="plugin-overlay" class="plugin-overlay hidden">
<div class="plugin-dialog">
<div class="plugin-dialog-head">
<h3 id="plugin-dialog-title">🧩</h3>
<div style="display:flex;align-items:center;gap:10px">
<span id="plugin-dialog-sub" class="text-muted" style="font-size:12px"></span>
<button class="btn btn-secondary btn-sm" onclick="pluginClose()">✕ 关闭</button>
</div>
</div>
<div id="plugin-dialog-body" class="plugin-dialog-body"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script src="/assets/app.js"></script>
</body>
</html>
