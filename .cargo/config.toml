# 本机 crates.io 直连不稳定，使用国内镜像（rsproxy）
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

# zig 交叉编译（cargo-zigbuild）缓存重定向到项目内：统一位置、便于一键清理，
# 避免长期占用 %LOCALAPPDATA%（缓存可随时删除，会自动重建）
[env]
ZIG_GLOBAL_CACHE_DIR = { value = "target/zig-cache/global", relative = true }
ZIG_LOCAL_CACHE_DIR = { value = "target/zig-cache/local", relative = true }
CARGO_ZIGBUILD_CACHE_DIR = { value = "target/zig-cache/tools", relative = true }
