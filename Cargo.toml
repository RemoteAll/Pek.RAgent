[package]
name = "pek-ragent"
version = "0.1.8"
edition = "2024"
description = "Pek.RAgent：星尘代理（StarAgent 的 Rust 实现）——多应用守护、影子目录部署、跨平台服务管理与本地 HTTP 控制接口"
authors = ["PeiKeSmart"]
license = "MIT"

[dependencies]
# DH 基础库（DH.RustBase）：日志（XTrace 等价）、线程定时调度（Timer/TimerScheduler）、
# 网络内核（http 服务端/路由，对齐 DH.NCore HttpServer/HttpRouter）、
# HTTPS 客户端（http-tls：rustls+ring，AI 助手/在线插件源/健康检查等 https 调用必需；可 zig 交叉编 musl）、
# 配置兼容（XML 主配置 Config/StarAgent.config + 旧版 TOML 迁移）、
# 在线终端（term：真 PTY 会话引擎，Windows ConPTY / Unix openpty）、
# 插件协议（plugin：插件包格式 + 插件源目录 Ed25519 签名，与 Pek.RPanlServer 共用）、
# AI 客户端（net::openai：OpenAI 兼容 /chat/completions）
dhrust = { path = "../DH.RustBase", features = ["net", "http-tls", "toml", "service", "zip-extract", "term", "plugin", "patch"] }
# 数据访问（Pek.RCode = DH.NCode/XCode 的 Rust 实现）：流量历史每日归档落 SQLite
# （rusqlite 内嵌，无外部依赖）；模型按 XCode 规范维护于 Entity/Model.xml，
# 与 C# / rcodegen 生态共用同一份模型。按“仅 SQLite 消费方”裁剪驱动与 TLS。
pek-rcode = { path = "../Pek.RCode", default-features = false, features = ["database"] }
# 管理组件（Pek.RAdmin）：面板用户与操作审计数据层（audit.rs 薄壳消费；仅管理界面项目需要）
pek-radmin = { path = "../Pek.RAdmin" }
# 配置与状态序列化（AgentConfig / data/state.json）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# 部署包解压（与 Pek.RCode 同版本同特性；纯 Rust deflate）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 注：在线插件源签名（Ed25519）已随插件协议下沉至 dhrust::plugin（feature "plugin"）
# HTTP 服务端宿主运行时（dhrust::net::http 基于 hyper/tokio）
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 注：Windows 服务运行时（windows-service）已随 service 模块下沉至 dhrust
# 注：在线终端 portable-pty 已随 term 模块下沉至 dhrust（Windows 0.8 / Unix 0.9）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    # 机器信息（-ShowMachineInfo）：网卡枚举 / 磁盘枚举 / CPU 型号注册表读取
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    # Web 面板：进程枚举/线程数（Toolhelp）与 TCP 连接表（IpHelper）
    "Win32_System_Diagnostics_ToolHelp",
    # Web 面板：磁盘 IOPS 采样（DeviceIoControl → IOCTL_DISK_PERFORMANCE；CreateFileW 依赖 Security）
    "Win32_System_IO",
    "Win32_Security",
] }

[profile.release]
lto = "thin"
strip = true
# 启用增量编译：重打包时只重编改动部分（缓存位于 target/*/release/incremental）
incremental = true
